name: Daily DSA Solution Push

on:
  schedule:
    # Runs every day at 09:00 UTC (Adjust UTC time as needed)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  push-solution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and Commit Next Solution
        run: |
          # Configure Git identity for the GitHub Actions bot
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Target file extensions for DSA problems
          EXTENSIONS="py|cpp|java|js|ts|c|cs|go|rs|md"

          # Find untracked files with target extensions, sort alphabetically, and pick the first one
          FILE_TO_PUSH=$(git status --porcelain | grep '^??' | awk '{print $2}' | grep -E "\.($EXTENSIONS)$" | sort | head -n 1)

          if [ -z "$FILE_TO_PUSH" ]; then
            echo "No new solution files found to commit!"
            exit 0
          fi

          # Format commit message from filename (e.g., 001_two_sum.py -> Add solution for 001 Two Sum)
          BASENAME=$(basename "$FILE_TO_PUSH")
          FILENAME_NO_EXT="${BASENAME%.*}"
          CLEAN_NAME=$(echo "$FILENAME_NO_EXT" | sed 's/_/ /g')

          echo "Staging file: $FILE_TO_PUSH"
          git add "$FILE_TO_PUSH"

          COMMIT_MSG="Add solution for $CLEAN_NAME"
          echo "Committing: $COMMIT_MSG"
          git commit -m "$COMMIT_MSG"

          echo "Pushing changes back to repository..."
          git push origin main
